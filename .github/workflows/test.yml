name: Backend checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      # 集成测试需要本地 MySQL、Redis；CI 先运行不依赖这些服务的单元测试。
      - name: Test and package backend
        run: mvn -B -Dtest=ShopBloomFilterTest,CacheClientBloomTest package
