name: lingxiangshenghuo

services:
  mysql:
    image: mysql:8.0.43
    container_name: lingxiangshenghuo-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
      MYSQL_DATABASE: lingxiangshenghuo
      MYSQL_USER: lingxiangshenghuo
      MYSQL_PASSWORD: "123456"
    ports:
      - "127.0.0.1:13307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db/lingxiangshenghuo.sql:/opt/lingxiangshenghuo.sql:ro
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/01-lingxiangshenghuo.sql:ro

  redis:
    image: redis:7.2.10-alpine
    container_name: lingxiangshenghuo-redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: lingxiangshenghuo-rabbitmq
    hostname: ${RABBITMQ_HOSTNAME:-lingxiangshenghuo-rabbitmq}
    environment:
      RABBITMQ_NODENAME: ${RABBITMQ_NODENAME:-rabbit@lingxiangshenghuo-rabbitmq}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  mysql-data:
    name: ${MYSQL_VOLUME_NAME:-lingxiangshenghuo_mysql-data}
  redis-data:
    name: ${REDIS_VOLUME_NAME:-lingxiangshenghuo_redis-data}
  rabbitmq-data:
    name: ${RABBITMQ_VOLUME_NAME:-lingxiangshenghuo_rabbitmq-data}
