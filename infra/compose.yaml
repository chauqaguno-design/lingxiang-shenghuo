name: linxiang

# 本文件中的密码是公开的本机演示值，不要在公网环境使用。
# 所有端口只监听本机；独立命名卷不会接触其他项目的数据。
services:
  mysql:
    image: mysql:8.0.43
    container_name: linxiang-mysql
    environment:
      MYSQL_DATABASE: linxiang
      MYSQL_USER: linxiang
      MYSQL_PASSWORD: linxiang_demo_password
      MYSQL_ROOT_PASSWORD: linxiang_root_demo_password
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=128M", "--max-connections=200"]
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.2.10-alpine
    container_name: linxiang-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  namesrv:
    image: apache/rocketmq:4.9.6
    container_name: linxiang-namesrv
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx256m -Xmn128m"
    command: ["sh", "mqnamesrv"]
    ports:
      - "127.0.0.1:19876:9876"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/9876'"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Docker 新命名卷默认归 root；只初始化本项目卷的目录所有者。
  broker-store-init:
    image: apache/rocketmq:4.9.6
    container_name: linxiang-broker-store-init
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 3000:3000 /home/rocketmq/store"]
    volumes:
      - broker-store:/home/rocketmq/store
    mem_limit: 64m

  broker:
    image: apache/rocketmq:4.9.6
    container_name: linxiang-broker
    environment:
      NAMESRV_ADDR: namesrv:9876
      JAVA_OPT_EXT: "-Xms256m -Xmx512m -Xmn128m -XX:MaxDirectMemorySize=128m"
    command: ["sh", "mqbroker", "-c", "/home/rocketmq/rocketmq-4.9.6/conf/linxiang-broker.conf"]
    depends_on:
      namesrv:
        condition: service_healthy
      broker-store-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:10909:10909"
      - "127.0.0.1:10911:10911"
    volumes:
      - ./broker.conf:/home/rocketmq/rocketmq-4.9.6/conf/linxiang-broker.conf:ro
      - broker-store:/home/rocketmq/store
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/10911'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  mysql-data:
  redis-data:
  broker-store:
